<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>ThoughtShare - Minimalist Feedback</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#135bec",
                        "background-light": "#f6f6f8",
                        "background-dark": "#101622",
                    },
                    fontFamily: {
                        "display": ["Inter"]
                    },
                    borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
                },
            },
        }
    </script>
</head>

<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 min-h-screen">
    <div class="relative flex min-h-screen w-full flex-col">
        
        <!-- Main Content -->
        <main class="flex-1 flex items-center justify-center p-6 md:p-12">
            <div
                class="w-full max-w-[640px] bg-white dark:bg-slate-900 rounded-xl shadow-xl shadow-slate-200/50 dark:shadow-none border border-slate-100 dark:border-slate-800 p-8 md:p-12">
                <div class="text-center mb-10">
                    <h1 class="text-slate-900 dark:text-white text-3xl md:text-4xl font-bold tracking-tight mb-3">Envío de QR</h1>
                    <p class="text-slate-500 dark:text-slate-400 text-base">Esta Pag es para que ingreses un mensaje y se envie en forma de QR al correo que ingreses.</p>
                </div>
                <form id="formId" class="space-y-6">
                    <!-- Message Textarea -->
                    <div class="flex flex-col gap-2">
                        <label class="text-slate-700 dark:text-slate-300 text-sm font-semibold ml-1">Tu Mensaje</label>
                        <textarea
                            id="mensajeId"
                            class="w-full min-h-[180px] rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800/50 p-4 text-slate-900 dark:text-slate-100 placeholder:text-slate-400 focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all outline-none resize-none text-base"
                            placeholder="Cual es el mensaje a enviar?..."></textarea>
                    </div>

                    <!-- Codigo Textarea -->
                    <div class="flex flex-col gap-2">
                        <label class="text-slate-700 dark:text-slate-300 text-sm font-semibold ml-1">Tu Código</label>
                        <textarea
                            id="codigoId"
                            class="w-full min-h-[180px] rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800/50 p-4 text-slate-900 dark:text-slate-100 placeholder:text-slate-400 focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all outline-none resize-none text-base"
                            placeholder="Cual es el codigo a enviar?..."></textarea>
                    </div>

                    <!-- Email Input -->
                    <div class="flex flex-col gap-2">
                        <label class="text-slate-700 dark:text-slate-300 text-sm font-semibold ml-1">Tu correo electrónico</label>
                        <div class="relative">
                            <span
                                class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-lg">mail</span>
                            <input
                                id="emailId"
                                class="w-full h-14 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800/50 pl-12 pr-4 text-slate-900 dark:text-slate-100 placeholder:text-slate-400 focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all outline-none text-base"
                                placeholder="name@example.com" type="email" />
                        </div>
                    </div>
                    <!-- Action Button -->
                    <div class="flex justify-end pt-4">
                        <button
                            class="flex min-w-[140px] items-center justify-center gap-2 rounded-xl h-14 px-8 bg-primary text-white text-base font-bold transition-all hover:bg-primary/90 hover:-translate-y-0.5 shadow-lg shadow-primary/25 active:translate-y-0">
                            <span>Send</span>
                            <span class="material-symbols-outlined text-lg">send</span>
                        </button>
                    </div>
                </form>
                <!-- Footer/Subtext inside container -->
                <div class="mt-8 pt-8 border-t border-slate-100 dark:border-slate-800 text-center">
                    <p class="text-slate-400 dark:text-slate-500 text-xs uppercase tracking-widest font-medium">
                        Secure &amp; Anonymous • Encrypted Delivery
                    </p>
                </div>
            </div>
        </main>
        <!-- Minimal Page Footer -->
        <footer class="px-6 py-8 text-center text-slate-400 dark:text-slate-600 text-sm">
            © 2026 Pag de Practica creada como proyecto de prueba.
        </footer>
    </div>
    <script src="js/app.js"></script>
</body>

</html>
